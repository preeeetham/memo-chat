# Load test overlay: a mock LLM, mock search, N app replicas behind nginx, and Locust.
#   export COMPOSE_FILE=docker-compose.yml:loadtest/docker-compose.loadtest.yml
#   docker compose up -d --build                 # 3 app replicas (LT_APP_REPLICAS), lb on :3000
#   docker compose run --rm --no-deps locust      # LT_USERS, LT_SPAWN_RATE, LT_DURATION
# No API keys are used: the LLM and web search are mocked, so the test costs nothing.
x-mock-env: &mock-env
  LLM_BASE_URL: http://mock-llm:8080/v1
  LLM_API_KEY: mock
  LLM_MODEL: mock-main
  HELPER_MODEL: mock-helper
  LLM_FALLBACK_MODEL: ""
  EMBEDDING_MODEL: ""
  SEARCH_PROVIDER: mock
  SEARCH_FALLBACK_PROVIDER: ""
  RATE_LIMIT_PER_MINUTE: "100000"
  DAILY_TOKEN_BUDGET: "0"
  SEED_DEMO: "false"
  # A fixed "now" (Wednesday 11 Nov 2026, Kolkata) so "on Monday" and "last Tuesday" have one right answer.
  MEMOCHAT_FAKE_NOW: 2026-11-11T14:05:00+05:30
  PG_POOL_MAX: "20"

services:
  mock-llm:
    image: memo-chat:local
    pull_policy: never
    command: ["node_modules/.bin/tsx", "loadtest/mock-llm.ts"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  app:
    ports: !reset []
    deploy:
      replicas: ${LT_APP_REPLICAS:-3}
    environment: *mock-env
    depends_on:
      mock-llm: { condition: service_started }

  worker:
    environment:
      <<: *mock-env
      WORKER_CONCURRENCY: "16"
    deploy:
      replicas: ${LT_WORKER_REPLICAS:-2}

  seed:
    environment: *mock-env

  lb:
    image: nginx:1.27-alpine
    volumes: ["./loadtest/nginx.conf:/etc/nginx/nginx.conf:ro"]  # paths are relative to the repo root
    ports: ["${LB_PORT:-3000}:80"]
    depends_on:
      app: { condition: service_healthy }

  locust:
    image: locustio/locust:2.32.4
    profiles: ["loadtest"]
    volumes: ["./loadtest:/mnt/locust"]
    working_dir: /mnt/locust
    command: >
      -f locustfile.py --headless --host http://lb
      -u ${LT_USERS:-100} -r ${LT_SPAWN_RATE:-10} -t ${LT_DURATION:-3m}
      --csv results/run --html results/report.html --only-summary
    depends_on:
      lb: { condition: service_started }
