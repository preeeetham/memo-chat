# Spread requests over every app replica. Resolving "app" per request through Docker's DNS
# (which returns the replicas in rotating order) means scaling up or down needs no nginx reload.
events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 80;
    location / {
      set $app_upstream app:3000;
      proxy_pass http://$app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_buffering off;          # stream SSE as it arrives
      proxy_read_timeout 300s;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
